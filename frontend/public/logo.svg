<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="umnyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded hexagon -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#0B0F17" stroke="url(#umnyGradient)" stroke-width="2.5" />
  <!-- Stylized dynamic 'U' & Neural Spark -->
  <path d="M 28 32 V 54 C 28 66 38 72 50 72 C 62 72 72 66 72 54 V 32" stroke="url(#umnyGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Central intelligence core / neural spark -->
  <circle cx="50" cy="46" r="6" fill="#06B6D4" />
  <circle cx="50" cy="46" r="10" stroke="#8B5CF6" stroke-width="2" opacity="0.6" stroke-dasharray="3 3"/>
</svg>

